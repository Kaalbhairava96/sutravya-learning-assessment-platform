name: Assessment platform checks

on:
  push:
    branches:
      - registration-launch
      - qualinova-htse-implementation
  pull_request:
    branches:
      - registration-launch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run backend unit tests
        run: python -m unittest discover -s tests -v

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check site.js
          node --check mock-test.js
          node --check sample-papers.js
      - name: Build allowlisted assessment website
        run: bash scripts/build_assessment_site.sh
