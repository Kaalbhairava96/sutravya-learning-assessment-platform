name: Backend tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sutravya_m3_test
          POSTGRES_PASSWORD: sutravya_m3_test
          POSTGRES_DB: sutravya_m3_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U sutravya_m3_test -d sutravya_m3_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      LOG_LEVEL: CRITICAL
      DATABASE_URL: postgresql+psycopg://sutravya_m3_test:sutravya_m3_test@127.0.0.1:55432/sutravya_m3_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt
      - name: Apply schema migrations to disposable CI database
        working-directory: backend
        run: alembic upgrade head
      - name: Run backend tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
