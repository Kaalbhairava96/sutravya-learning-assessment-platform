<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" role="img" aria-labelledby="t d"><title id="t">Contact and partner coordination</title><desc id="d">Two partner cards joined through a gold healthcare communication thread.</desc><defs>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff6d9"/><stop offset=".2" stop-color="#e6c77e"/><stop offset=".48" stop-color="#a87926"/><stop offset=".68" stop-color="#f6e3ad"/><stop offset="1" stop-color="#b88d41"/></linearGradient>
<linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".25" stop-color="#d6d7d5"/><stop offset=".52" stop-color="#9fa3a5"/><stop offset=".77" stop-color="#f9faf8"/><stop offset="1" stop-color="#b9bdbe"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".94"/><stop offset="1" stop-color="#ebe8df" stop-opacity=".82"/></linearGradient>
<radialGradient id="aura"><stop stop-color="#d5b36a" stop-opacity=".4"/><stop offset="1" stop-color="#d5b36a" stop-opacity="0"/></radialGradient>
