<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" role="img" aria-labelledby="t d"><title id="t">Candidate registration journey</title><desc id="d">Visual four-step registration workflow with a glossy form card and connected verification milestones.</desc><defs>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff6d9"/><stop offset=".2" stop-color="#e6c77e"/><stop offset=".48" stop-color="#a87926"/><stop offset=".68" stop-color="#f6e3ad"/><stop offset="1" stop-color="#b88d41"/></linearGradient>
<linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".25" stop-color="#d6d7d5"/><stop offset=".52" stop-color="#9fa3a5"/><stop offset=".77" stop-color="#f9faf8"/><stop offset="1" stop-color="#b9bdbe"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".94"/><stop offset="1" stop-color="#ebe8df" stop-opacity=".82"/></linearGradient>
<radialGradient id="aura"><stop stop-color="#d5b36a" stop-opacity=".4"/><stop offset="1" stop-color="#d5b36a" stop-opacity="0"/></radialGradient>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="12"/><feOffset dy="18"/><feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft"><feGaussianBlur stdDeviation="20"/></filter>
</defs><ellipse cx="420" cy="315" rx="330" ry="230" fill="url(#aura)"/><g filter="url(#shadow)"><rect x="250" y="60" width="430" height="490" rx="34" fill="url(#glass)" stroke="#c5c7c4" stroke-width="3"/><rect x="280" y="95" width="370" height="65" rx="15" fill="url(#silver)"/><circle cx="315" cy="127" r="13" fill="url(#gold)"/><rect x="344" y="117" width="170" height="9" rx="4" fill="#756447"/><rect x="344" y="134" width="110" height="6" rx="3" fill="#9b9d9a"/><text x="286" y="202" font-size="15" fill="#7e693f" font-family="Arial" font-weight="700">CANDIDATE DETAILS</text><rect x="286" y="220" width="350" height="45" rx="10" fill="#fff" stroke="#c9c8c0"/><rect x="286" y="282" width="350" height="45" rx="10" fill="#fff" stroke="#c9c8c0"/><rect x="286" y="344" width="165" height="45" rx="10" fill="#fff" stroke="#c9c8c0"/><rect x="471" y="344" width="165" height="45" rx="10" fill="#fff" stroke="#c9c8c0"/><rect x="286" y="425" width="350" height="56" rx="15" fill="url(#gold)"/><text x="461" y="459" text-anchor="middle" fill="#fff" font-size="17" font-family="Arial" font-weight="700">REVIEW APPLICATION</text></g><path d="M90 150V445" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/><g font-family="Arial"><circle cx="90" cy="155" r="28" fill="url(#gold)"/><text x="90" y="162" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">1</text><text x="135" y="150" font-size="17" fill="#3f382a" font-weight="700">Choose pathway</text><text x="135" y="174" font-size="13" fill="#817760">Nursing · Paramedical · MBBS</text><circle cx="90" cy="250" r="28" fill="url(#silver)" stroke="#b18a3c" stroke-width="2"/><text x="90" y="257" text-anchor="middle" fill="#6c5225" font-size="18" font-weight="700">2</text><text x="135" y="245" font-size="17" fill="#3f382a" font-weight="700">Enter details</text><text x="135" y="269" font-size="13" fill="#817760">Academic &amp; contact information</text><circle cx="90" cy="345" r="28" fill="url(#silver)" stroke="#b18a3c" stroke-width="2"/><text x="90" y="352" text-anchor="middle" fill="#6c5225" font-size="18" font-weight="700">3</text><text x="135" y="340" font-size="17" fill="#3f382a" font-weight="700">Verify email</text><text x="135" y="364" font-size="13" fill="#817760">One-time code confirmation</text><circle cx="90" cy="440" r="28" fill="url(#gold)"/><text x="90" y="447" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">4</text><text x="135" y="435" font-size="17" fill="#3f382a" font-weight="700">Review status</text><text x="135" y="459" font-size="13" fill="#817760">Payment integration is separate</text></g></svg>