<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" role="img" aria-labelledby="t d">
<title id="t">Premium academic and innovation awards</title><desc id="d">A polished gold trophy with laurel branches, a merit medal, a certificate and a ribbon rosette.</desc>
