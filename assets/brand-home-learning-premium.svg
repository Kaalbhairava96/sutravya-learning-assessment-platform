<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" role="img" aria-labelledby="t d">
<title id="t">Premium medical learning and academic preparation</title><desc id="d">A three-dimensional stack of medical books, a tablet with an anatomical hologram, a stethoscope and study tools.</desc>
