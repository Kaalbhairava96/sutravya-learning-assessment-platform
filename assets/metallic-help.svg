<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" role="img" aria-labelledby="t d"><title id="t">Candidate support and help centre</title><desc id="d">Illustrative support cards connected around a clear candidate help centre.</desc><defs>
